let FILTER={grupo:'__ALL__',carteira:'__ALL__'};
let D_VIEW=D; // dados após aplicação do filtro

function applyFilter(){
const fc={...D,carteiras:[...D.carteiras]};
if(FILTER.grupo!=='__ALL__'){fc.carteiras=fc.carteiras.filter(c=>c.grupo===FILTER.grupo);}
if(FILTER.carteira!=='__ALL__'){fc.carteiras=fc.carteiras.filter(c=>c.nome===FILTER.carteira);}
const nomes=new Set(fc.carteiras.map(c=>c.nome));
fc.details={};fc.evolution={};fc.priorizacao={};fc.objetos={};
Object.keys(D.details||{}).forEach(k=>{if(nomes.has(k))fc.details[k]=D.details[k];});
Object.keys(D.evolution||{}).forEach(k=>{if(nomes.has(k))fc.evolution[k]=D.evolution[k];});
Object.keys(D.priorizacao||{}).forEach(k=>{if(nomes.has(k))fc.priorizacao[k]=D.priorizacao[k];});
Object.keys(D.objetos||{}).forEach(k=>{if(nomes.has(k))fc.objetos[k]=D.objetos[k];});
D_VIEW=fc;
renderBody();
}

function renderBody(){
const el=document.getElementById('app-body');
if(D_VIEW.carteiras.length===0){el.innerHTML='<div class="card" style="text-align:center;padding:40px;color:var(--td)">Nenhuma carteira encontrada com os filtros selecionados.</div>';return;}
el.innerHTML=overview()+statSection()+offenders()+evolutionSection()+priorizacaoSection()+objetos()+conclusion();
bindBtns('cart-sel','panel','data-c','data-p');
bindBtns('evo-sel','evo-panel','data-ec','data-ep');
bindBtns('prio-sel','prio-panel','data-pc','data-pp');
}

}

function renderEvoTable(periods, media){
const maxN=Math.max(...periods.map(p=>p.n));
return`<table class="tbl"><thead><tr><th>Período</th><th class="num">Volume</th><th class="num">Êxito</th><th class="num">vs média</th><th style="width:200px">Volume + Êxito</th></tr></thead><tbody>
${periods.map(p=>{
const gap=Math.round((p.exito-media)*10)/10;
const cls=gap<=-3?'ofn':gap>=3?'fav':'neu';
const barW=Math.max(2,p.n/maxN*120);
const exitoW=Math.max(2,p.exito*1.2);
const exitoC=p.exito>=media?'g':p.exito>=media-5?'y':'r';
return`<tr><td class="mono">${p.q}</td><td class="num">${p.n.toLocaleString('pt-BR')}</td><td class="num ${cls}">${p.exito}%</td><td class="num ${cls}">${gap>0?'+':''}${gap}pp</td>
<td><div style="display:flex;align-items:center;gap:4px"><div class="bar ba" style="width:${barW}px;opacity:.3"></div><div class="bar b${exitoC}" style="width:${exitoW}px"></div></div></td></tr>`}).join('')}</tbody></table>`}

function renderGeoEvo(geoData, cartMedia){
const entries=Object.entries(geoData).sort((a,b)=>b[1].total_n-a[1].total_n);
// Compute trend for each
const withTrend=entries.map(([name,data])=>{
const ps=data.periods;
if(ps.length<3)return{name,data,delta:0};
const first=ps.slice(0,Math.ceil(ps.length/2));
const second=ps.slice(Math.ceil(ps.length/2));
const e1=first.reduce((s,p)=>s+p.n*p.exito,0)/first.reduce((s,p)=>s+p.n,0);
const e2=second.reduce((s,p)=>s+p.n*p.exito,0)/second.reduce((s,p)=>s+p.n,0);
return{name,data,delta:Math.round((e2-e1)*10)/10};
});

return`<table class="tbl"><thead><tr><th>Recorte</th><th class="num">n total</th><th>Período</th><th class="num">Δ (1ª→2ª metade)</th><th style="width:200px">Evolução</th></tr></thead><tbody>
${withTrend.map(({name,data,delta})=>{
const ps=data.periods;
const maxE=Math.max(...ps.map(p=>p.exito),1);
const minE=Math.min(...ps.map(p=>p.exito));
const range=maxE-minE||1;
const cls=delta<=-5?'ofn':delta>=5?'fav':'neu';
const sparkBars=ps.map(p=>{
const h=Math.max(4,((p.exito-minE)/range)*28+4);
const c=p.exito>=cartMedia?'hi':p.exito>=cartMedia-5?'mid':'lo';
return`<div class="spark-bar ${c}" style="height:${h}px" title="${p.q}: ${p.exito}% (n=${p.n})"></div>`;
}).join('');
return`<tr><td class="mono" style="font-size:11px;font-weight:600">${name}</td><td class="num">${data.total_n.toLocaleString('pt-BR')}</td><td><span class="tag ty">${data.period_type}</span></td><td class="num ${cls}">${delta>0?'+':''}${delta}pp</td>
<td><div class="spark">${sparkBars}</div></td></tr>`}).join('')}</tbody></table>`}

function priorizacaoSection(){
if(!D_VIEW.priorizacao||Object.keys(D_VIEW.priorizacao).length===0)return'';
const pKeys=Object.keys(D_VIEW.priorizacao);
return`<div class="sec">
<div class="sec-hd"><span class="sec-n">05</span><h2>Priorização e Plano de Atuação</h2></div>
<p class="prose">Para cada carteira, os ofensores são ranqueados por <strong>impacto</strong> (gap × volume = sentenças de êxito perdidas). O sistema classifica a viabilidade de correção e gera recomendações específicas.</p>
<div class="cs" id="prio-sel">
${pKeys.map((k,i)=>`<div class="cb ${i===0?'act':''}" data-pc="${k}">${sn(k)}</div>`).join('')}
</div>
${pKeys.map((k,i)=>renderPrioPanel(k,i===0)).join('')}
</div>`}

function renderPrioPanel(cart,vis){
const pr=D_VIEW.priorizacao[cart];
if(!pr)return'';
const r=pr.resumo;
let h=`<div class="prio-panel" data-pp="${cart}" style="${vis?'':'display:none'}">`;

// Summary stats
h+=`<div class="g3" style="margin-bottom:16px">
<div class="sb"><div class="v">${r.n_ofensores}</div><div class="l">Ofensores</div></div>
<div class="sb"><div class="v" style="color:var(--r)">${Math.round(r.impacto_total_sentencas)}</div><div class="l">Sentenças perdidas</div></div>
<div class="sb"><div class="v">${r.efeito_total_pp}pp</div><div class="l">Ganho potencial se corrigidos</div></div>
</div>`;

// Synthesis actions
if(pr.sintese_acoes?.length>0){
h+=`<h3>Frentes de atuação</h3>`;
pr.sintese_acoes.forEach(a=>{
const pc=a.prioridade==='URGENTE'?'card-r':a.prioridade==='ALTA'?'card-a':a.prioridade==='MÉDIA'?'card-y':'card-p';
const tc=a.prioridade==='URGENTE'?'tr':a.prioridade==='ALTA'?'tb':a.prioridade==='MÉDIA'?'ty':'tp';
h+=`<div class="card ${pc}"><div class="ct"><span class="tag ${tc}">${a.prioridade}</span> ${a.frente}</div>
<p style="color:var(--tm);font-size:13px;margin:0">${a.descricao}${a.impacto_potencial?` <span class="mono" style="color:var(--o)">(${Math.round(a.impacto_potencial)} sentenças)</span>`:''}</p></div>`});
}

// Priority table
h+=`<h3>Ranking de ofensores por impacto</h3>
<table class="tbl"><thead><tr><th>#</th><th>Recorte</th><th>Nível</th><th class="num">n</th><th class="num">Êxito</th><th class="num">Gap</th><th class="num">Sent. perdidas</th><th class="num">Efeito carteira</th><th>Viabilidade</th></tr></thead><tbody>
${pr.prioridades.map(p=>{
const vc=p.viabilidade.nivel==='alta'?'tg':p.viabilidade.nivel==='media'?'ty':p.viabilidade.nivel==='baixa'?'tr':'tr';
const trend=p.tendencia==='caindo'?' 📉':'';
return`<tr><td class="mono" style="color:var(--a)">${p.rank}</td><td class="mono" style="font-size:11px;font-weight:600">${p.recorte}${trend}</td><td><span class="tag ty">${p.nivel_geo}</span></td><td class="num">${p.n.toLocaleString('pt-BR')}</td><td class="num ofn">${p.exito}%</td><td class="num ofn">${p.gap}pp</td><td class="num" style="color:var(--o);font-weight:600">${p.impacto_sentencas}</td><td class="num">${p.efeito_carteira_pp}pp</td><td><span class="tag ${vc}">${p.viabilidade.label}</span></td></tr>`}).join('')}
</tbody></table>`;

// Detailed recommendations for top 5
const top=pr.prioridades.slice(0,5);
if(top.length>0){
h+=`<h3>Recomendações detalhadas (top ${top.length})</h3>`;
top.forEach(p=>{
h+=`<div class="card card-a" style="margin-bottom:8px"><div class="ct">#${p.rank} ${p.recorte} <span style="color:var(--td);font-weight:400;font-size:12px">— ${p.impacto_sentencas} sentenças perdidas</span></div>`;
p.recomendacoes.forEach(rec=>{
const icon=rec.tipo==='urgente'?'🔴':rec.tipo==='diagnóstico'?'🔍':rec.tipo==='operacional'?'🔧':rec.tipo==='estratégico'?'📐':'⚙️';
h+=`<p style="color:var(--tm);font-size:12px;margin:4px 0;padding-left:16px">${icon} <strong>${rec.acao}:</strong> ${rec.detalhe}</p>`;
});
h+=`</div>`});
}

return h+`</div>`}

function objetos(){
let h=`<div class="sec"><div class="sec-hd"><span class="sec-n">06</span><h2>Êxito por Objeto</h2></div>`;
for(const[cl,objs] of Object.entries(D_VIEW.objetos)){
if(!objs?.length)continue;
const me=objs.reduce((s,o)=>s+o.n*o.exito,0)/objs.reduce((s,o)=>s+o.n,0);
h+=`<h3>${cl}</h3><table class="tbl"><thead><tr><th>Objeto</th><th class="num">n</th><th class="num">Êxito</th><th style="width:120px"></th></tr></thead><tbody>
${objs.map(o=>{const c=o.exito>=me?'g':o.exito>=me-10?'y':'r';const w=Math.max(2,o.exito*1.2);
return`<tr><td>${o.objeto}</td><td class="num">${o.n.toLocaleString('pt-BR')}</td><td class="num" style="color:var(--${c})">${o.exito}%</td><td><div class="bar-c"><div class="bar b${c}" style="width:${w}px"></div></div></td></tr>`}).join('')}</tbody></table>`}
return h+`</div>`}

function bindBtns(selId,panelClass,dataAttrBtn,dataAttrPanel){
document.querySelectorAll(`#${selId} .cb`).forEach(b=>{
b.addEventListener('click',()=>{
document.querySelectorAll(`#${selId} .cb`).forEach(x=>x.classList.remove('act'));
b.classList.add('act');
const v=b.getAttribute(dataAttrBtn);
document.querySelectorAll(`.${panelClass}`).forEach(p=>p.style.display='none');
const p=document.querySelector(`[${dataAttrPanel}="${v}"]`);
if(p)p.style.display='block';
})})
}
