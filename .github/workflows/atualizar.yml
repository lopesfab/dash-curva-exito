name: Atualizar Dashboard Curva de Êxito

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT (UTC-3) todos os dias
  workflow_dispatch:       # permite rodar manualmente

permissions:
  contents: write          # necessário para o bot conseguir commitar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar dashboard
        env:
          ODOO_URL:      ${{ secrets.ODOO_URL }}
          ODOO_DB:       ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        run: python gerar_dashboard.py

      - name: Commitar arquivo gerado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_live.html
          git diff --cached --quiet || git commit -m "chore: atualiza dashboard $(date '+%Y-%m-%d %H:%M BRT')"
          git push
